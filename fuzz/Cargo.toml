[package]
name = "sc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
candid = "0.10"
sc-types = { path = "../crates/sc-types" }

[workspace]

[[bin]]
name = "decode_submission"
path = "fuzz_targets/decode_submission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_text"
path = "fuzz_targets/validate_text.rs"
test = false
doc = false
bench = false
