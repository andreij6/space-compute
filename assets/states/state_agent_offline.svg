<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Offline Warning Ring -->
  <circle cx="120" cy="100" r="55" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- Disconnected Pulse Line -->
  <path d="M40,100 L85,100 L95,75 L105,120 L115,100 L125,100" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="125" cy="100" r="3" fill="#F59E0B"/>
  
  <!-- Gap / Severed Connection -->
  <line x1="130" y1="90" x2="135" y2="110" stroke="#EF4444" stroke-width="2.5"/>
  
  <!-- Inactive Flatline -->
  <circle cx="140" cy="100" r="3" fill="#64748B"/>
  <line x1="140" y1="100" x2="200" y2="100" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 4"/>
  
  <!-- Dormant Satellite Icon -->
  <polygon points="120,45 130,55 120,65 110,55" stroke="#94A3B8" stroke-width="2" fill="#1E293B"/>
  <line x1="95" y1="55" x2="110" y2="55" stroke="#64748B" stroke-width="2"/>
  <line x1="130" y1="55" x2="145" y2="55" stroke="#64748B" stroke-width="2"/>
  <rect x="90" y="47" width="10" height="16" stroke="#64748B" stroke-width="1.5" fill="#0F172A"/>
  <rect x="140" y="47" width="10" height="16" stroke="#64748B" stroke-width="1.5" fill="#0F172A"/>
</svg>
