<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="t1_bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99B6A"/>
      <stop offset="50%" stop-color="#A66738"/>
      <stop offset="100%" stop-color="#733E17"/>
    </linearGradient>
    <linearGradient id="t1_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C49B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A66738" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <circle cx="60" cy="60" r="52" fill="#131722" stroke="url(#t1_bronze)" stroke-width="3"/>
  <circle cx="60" cy="60" r="46" stroke="#A66738" stroke-dasharray="3 3" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Outer Aperture Ring -->
  <circle cx="60" cy="60" r="34" stroke="url(#t1_bronze)" stroke-width="2.5"/>
  
  <!-- Single Focus Lens / Crosshairs -->
  <line x1="60" y1="20" x2="60" y2="34" stroke="#D99B6A" stroke-width="2"/>
  <line x1="60" y1="86" x2="60" y2="100" stroke="#D99B6A" stroke-width="2"/>
  <line x1="20" y1="60" x2="34" y2="60" stroke="#D99B6A" stroke-width="2"/>
  <line x1="86" y1="60" x2="100" y2="60" stroke="#D99B6A" stroke-width="2"/>
  
  <!-- Central Aperture Core -->
  <circle cx="60" cy="60" r="16" fill="url(#t1_glow)" stroke="#D99B6A" stroke-width="2"/>
  <!-- Central Star Point -->
  <polygon points="60,49 63,57 71,60 63,63 60,71 57,63 49,60 57,57" fill="#FCEBD9"/>
  <circle cx="60" cy="60" r="2.5" fill="#FFFFFF"/>
</svg>
