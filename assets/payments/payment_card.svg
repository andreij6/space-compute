<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0C101D" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Credit Card Shape -->
  <rect x="14" y="19" width="36" height="26" rx="4" fill="url(#card_grad)" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="14" y="24" width="36" height="6" fill="#1E1B4B"/>
  
  <!-- Smart Chip / Text -->
  <rect x="18" y="34" width="6" height="5" rx="1" fill="#FCD34D"/>
  <line x1="28" y1="36" x2="42" y2="36" stroke="#C7D2FE" stroke-width="1.5"/>
