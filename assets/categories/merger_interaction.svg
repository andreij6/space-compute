  <circle cx="16" cy="20" r="5" fill="#F43F5E" stroke="#FB7185" stroke-width="1.5"/>
  <circle cx="16" cy="20" r="1.5" fill="#FFFFFF"/>
  
  <!-- Nucleus 2 -->
