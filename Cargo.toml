[workspace]
resolver = "2"
members = [
    "crates/sc-types",
    "crates/platform",
    "crates/payments",
    "crates/treasury",
    "crates/aaa",
    "crates/integration-tests",
    "crates/spike-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
candid = "0.10"
ic-cdk = "0.20"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sc-types = { path = "crates/sc-types" }
ic-cdk-timers = "1.0"
ic-stable-structures = "0.7"
rand_chacha = { version = "0.3", default-features = false }
sha2 = "0.10"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
