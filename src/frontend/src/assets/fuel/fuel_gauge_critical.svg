<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="fg_crit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>
  <!-- Outer Casing with Danger Stroke -->
  <rect x="8" y="10" width="134" height="36" rx="8" fill="#180A0A" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="144" y="20" width="8" height="16" rx="2" fill="#EF4444"/>
  
  <!-- 1 Level Bar (1 filled, 3 empty = Critical < 3 days) -->
  <rect x="16" y="17" width="26" height="22" rx="4" fill="url(#fg_crit)"/>
  <rect x="46" y="17" width="26" height="22" rx="4" stroke="#450A0A" stroke-dasharray="2 2" fill="none"/>
  <rect x="76" y="17" width="26" height="22" rx="4" stroke="#450A0A" stroke-dasharray="2 2" fill="none"/>
  <rect x="106" y="17" width="26" height="22" rx="4" stroke="#450A0A" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Critical Flashing Warning Symbol -->
  <polygon points="90,19 96,28 92,28 94,36 86,27 90,27" fill="#EF4444"/>
</svg>
