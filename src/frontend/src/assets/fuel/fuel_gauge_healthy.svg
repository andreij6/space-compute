<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="fg_healthy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Outer Battery / Fuel Cell Casing -->
  <rect x="8" y="10" width="134" height="36" rx="8" fill="#0B132B" stroke="#334155" stroke-width="2"/>
  <!-- Terminal Cap -->
  <rect x="144" y="20" width="8" height="16" rx="2" fill="#475569"/>
  
  <!-- 4 Level Bars (All 4 filled = Healthy > 14 days) -->
  <rect x="16" y="17" width="26" height="22" rx="4" fill="url(#fg_healthy)"/>
  <rect x="46" y="17" width="26" height="22" rx="4" fill="url(#fg_healthy)"/>
  <rect x="76" y="17" width="26" height="22" rx="4" fill="url(#fg_healthy)"/>
  <rect x="106" y="17" width="26" height="22" rx="4" fill="url(#fg_healthy)"/>
  
  <!-- Bolt / Energy Icon -->
  <polygon points="28,21 34,28 30,28 32,35 24,27 28,27" fill="#FFFFFF" opacity="0.9"/>
</svg>
