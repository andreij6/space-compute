<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="t2_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C7D6"/>
      <stop offset="100%" stop-color="#7B8599"/>
    </linearGradient>
    <linearGradient id="t2_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <circle cx="60" cy="60" r="52" fill="#0F172A" stroke="url(#t2_silver)" stroke-width="3"/>
  <circle cx="60" cy="60" r="46" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  
  <!-- Dual Intersecting Focal Rings (Binocular/Observer Optics) -->
  <circle cx="50" cy="60" r="26" stroke="url(#t2_silver)" stroke-width="2"/>
  <circle cx="70" cy="60" r="26" stroke="url(#t2_silver)" stroke-width="2"/>
  
  <!-- Optical Overlap Core Glow -->
  <ellipse cx="60" cy="60" rx="16" ry="24" fill="url(#t2_glow)"/>
  
  <!-- Twin Stars -->
  <circle cx="50" cy="60" r="3" fill="#E2E8F0"/>
  <circle cx="70" cy="60" r="3" fill="#E2E8F0"/>
  
  <!-- Central Six-Point Observer Star -->
  <polygon points="60,44 63,55 74,60 63,65 60,76 57,65 46,60 57,55" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="3" fill="#93C5FD"/>
</svg>
