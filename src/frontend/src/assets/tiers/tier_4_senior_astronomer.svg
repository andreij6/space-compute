<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="t4_plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="t4_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="t4_corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hexagonal Stepped Shield -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="#0B1329" stroke="url(#t4_plat)" stroke-width="3"/>
  <polygon points="60,13 102,37 102,83 60,107 18,83 18,37" stroke="url(#t4_cyan)" stroke-width="1.5" stroke-dasharray="6 3"/>
  
  <!-- Outer Celestial Orbital Ring -->
  <ellipse cx="60" cy="60" rx="42" ry="18" stroke="url(#t4_cyan)" stroke-width="1.5" transform="rotate(-30 60 60)" opacity="0.8"/>
  <ellipse cx="60" cy="60" rx="42" ry="18" stroke="url(#t4_cyan)" stroke-width="1.5" transform="rotate(30 60 60)" opacity="0.8"/>
  
  <!-- Coronagraph Glow -->
  <circle cx="60" cy="60" r="28" fill="url(#t4_corona)"/>
  
  <!-- 8-Point Diffraction Spikes -->
  <line x1="60" y1="18" x2="60" y2="102" stroke="#BAE6FD" stroke-width="2"/>
  <line x1="18" y1="60" x2="102" y2="60" stroke="#BAE6FD" stroke-width="2"/>
  <line x1="30" y1="30" x2="90" y2="90" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="30" y1="90" x2="90" y2="30" stroke="#38BDF8" stroke-width="1.5"/>
  
  <!-- Central Diamond Core -->
  <polygon points="60,46 69,60 60,74 51,60" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="4" fill="#FFFFFF"/>
</svg>
