<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="t3_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="t3_gold_soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal Outer Frame -->
  <polygon points="60,8 105,34 105,86 60,112 15,86 15,34" fill="#1A1500" stroke="url(#t3_gold)" stroke-width="3"/>
  <polygon points="60,16 98,38 98,82 60,104 22,82 22,38" stroke="#FFE082" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Triple Chevron Orbitals -->
  <path d="M35,92 L60,78 L85,92" stroke="url(#t3_gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40,98 L60,86 L80,98" stroke="url(#t3_gold)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M45,104 L60,94 L75,104" stroke="url(#t3_gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Central Six-Point Primary Diffraction Starburst -->
  <polygon points="60,26 65,48 88,52 69,63 76,84 60,70 44,84 51,63 32,52 55,48" fill="url(#t3_gold)" stroke="#FFF" stroke-width="1"/>
  <circle cx="60" cy="58" r="8" fill="url(#t3_gold_soft)"/>
  <circle cx="60" cy="58" r="3" fill="#FFFFFF"/>
</svg>
