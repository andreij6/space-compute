<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logo_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="logo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="logo_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Circle / Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#logo_bg)" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Outer Astronomical Orbital Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="85" stroke="#38BDF8" stroke-width="6" stroke-dasharray="16 12" transform="rotate(-30 256 256)" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="200" ry="85" stroke="#F59E0B" stroke-width="4" stroke-dasharray="12 16" transform="rotate(30 256 256)" opacity="0.4"/>
  
  <!-- Central JWST Hexagonal Mirror Frame -->
  <polygon points="256,76 396,157 396,319 256,400 116,319 116,157" fill="#090D1A" stroke="url(#logo_gold)" stroke-width="14"/>
  <polygon points="256,104 372,171 372,305 256,372 140,305 140,171" stroke="#FDE68A" stroke-width="4" stroke-dasharray="8 6" opacity="0.7"/>
  
  <!-- Radiant Quantum Core Glow -->
  <circle cx="256" cy="256" r="110" fill="url(#logo_core)"/>
  
  <!-- 8-Point Diffraction Starburst -->
  <polygon points="256,120 274,226 380,244 286,270 300,376 244,286 188,376 226,270 132,244 238,226" fill="url(#logo_gold)"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>
